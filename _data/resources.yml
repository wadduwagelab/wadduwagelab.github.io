# ---------- Glossary ----------
glossary:
  - term: "Computational imaging"
    def: "Imaging in which the final picture is computed from raw measurements rather than formed directly by lenses."
  - term: "Differentiable microscopy (∂µ)"
    def: "Modeling the optics and the reconstruction as one differentiable system, so that both can be trained together by backpropagation."
  - term: "Forward model / inverse problem"
    def: "The forward model predicts the measurement from the sample; the inverse problem recovers the sample from a measurement that the optics have blurred, scattered or encoded."
  - term: "Scattering"
    def: "Light changing direction many times inside tissue, like headlights in fog. It blurs images taken deep in tissue."
  - term: "Multiphoton (two-photon) excitation"
    def: "Fluorescence excited only where the laser intensity is very high, which confines the signal and lets microscopes image deeper."
  - term: "TFM"
    def: "Temporal focusing microscopy: wide-field multiphoton imaging that excites a whole plane at once by focusing the laser pulse in time."
  - term: "Structured illumination (SIM)"
    def: "Illuminating the sample with known patterns so that computation can recover information that a single image loses."
  - term: "DEEP"
    def: "De-scattering with excitation patterning: patterned temporal-focusing excitation plus a computational reconstruction to see through scattering."
  - term: "DEEP²"
    def: "DEEP with a neural network that needs far fewer patterns, making imaging about ten times faster."
  - term: "QPI / QPM"
    def: "Quantitative phase imaging (microscopy): label-free imaging of how much a transparent cell delays light, which relates to its thickness and density."
  - term: "D2NN"
    def: "Diffractive deep neural network: stacked optical layers whose structure is learned so that light passing through them computes."
  - term: "Optical neuron"
    def: "A single learnable element of a diffractive network, for example the phase delay of one pixel."
  - term: "BPM / ∂BPM"
    def: "The beam propagation method, a model of light propagating through a medium; ∂BPM is its differentiable version, used to train thick optical networks."
  - term: "FDTD"
    def: "Finite-difference time-domain: a full-wave simulation of light used to check that faster, simpler models are accurate."
  - term: "Untrained network"
    def: "A neural network fitted to a single measurement with the physics built in, without a training set."
  - term: "Out-of-distribution (OOD)"
    def: "Data unlike the data a model was trained on, where its predictions should not be trusted."
  - term: "Permutation test"
    def: "A statistical test that shuffles labels to check whether a result could have arisen by chance."

