# Resources page (/resources/) for prospective and incoming students. Rendered by resources.html.
# Sources: lab mentoring notes, course syllabi (DASC 428/528, CS 740/840, CS 795/895), the lab writing SOP and
# summer work plan, site data (research, publications, software), and a benchmark of other labs' onboarding pages (Oct 2026).
# All links were checked in Oct 2026 (DOIs against Crossref/OpenAlex).
# Rules: public links only (no Canvas, Drive, Overleaf, Slack or private repos); no names of students; keep each list short.
# `ours: true` = assigned in the lab's own courses; `core: true` = do this first if time is short; `intl: true` = international students.
# Times are rough estimates. Review the whole page once a year and update `reviewed`.

reviewed: "Oct 2026"
intro: "A starting point for students who are thinking about joining the lab or have just been admitted. It collects what we ask new members to read, run and practice in their first weeks, so that you can begin before you arrive. Work through it at your own pace."

routes:
  - label: "Thinking of applying"
    href: "#apply"
  - label: "Admitted, not yet here"
    href: "#start"
  - label: "Just arrived at ODU"
    href: "#first-weeks"
  - label: "Already in the lab"
    href: "#how-we-work"

# ---------- Start here: five things, in order ----------
start:
  - title: "Read three short stories about our work"
    time: "30 min"
    text: "Plain-language introductions to two of the lab's directions: imaging through scattering tissue, and optics designed by machine learning."
    links:
      - label: "DEEP²"
        url: "https://news.harvard.edu/gazette/story/2023/10/a-deeper-squared-dive-into-ai/"
      - label: "DEEP"
        url: "https://news.mit.edu/2021/microscopy-tissue-images-0707"
      - label: "3D metastructures"
        url: "https://news.mit.edu/2026/powerful-shrinking-technique-could-enable-devices-compute-light-0512"
  - title: "Learn the vocabulary"
    time: "15 min"
    text: "The glossary at the end of this page defines the terms you will hear in lab meetings."
    links:
      - label: "Glossary"
        url: "#glossary"
  - title: "Run a differentiable microscope"
    time: "2 h"
    text: "Open the Colab notebooks of our all-optical phase-retrieval paper and train an optical system end to end in your browser."
    links:
      - label: "All-Optical-QPM"
        url: "https://github.com/wadduwagelab/All-Optical-QPM"
  - title: "Listen to Tensor &amp; Bias"
    time: "8 episodes"
    text: "The podcast of our deep learning course, one AI-narrated episode per module, from tensors and GPUs to how models fail in the wild."
    links:
      - label: "Spotify"
        url: "https://open.spotify.com/show/033Aem6pMGVLeZftOmAEFj"
  - title: "Start Writing in the Sciences"
    time: "module 1, ≈2 h"
    text: "Kristin Sainani's free Stanford course. New members are asked to take it, and the lab's internal writing handbook is based on it."
    links:
      - label: "Course"
        url: "https://www.coursera.org/learn/sciwrite"
      - label: "Videos"
        url: "https://www.youtube.com/@sciwritestanford1636"

# ---------- Thinking of applying ----------
apply:
  text: "PhD students join the lab through the graduate programs at Old Dominion University. Current students are in the PhD program in Computer Science; students from Physics and Data Science are also welcome. Admission decisions are made by the graduate programs, so apply to the program as well as writing to the lab. Check the program's application deadline early; deadlines for international applicants are often earlier."
  background:
    - "Linear algebra and some calculus and probability."
    - "Programming in Python (NumPy; PyTorch or JAX is a plus)."
    - "Some exposure to optics, signal or image processing, or machine learning. You do not need all three; the learning path below fills the gaps."
    - "Curiosity about biology. The lab builds instruments and methods for biologists and clinicians."
  steps:
    - "Read two or three of our papers (see <a href=\"#papers\">Read our work</a>) and decide which direction interests you most."
    - "Email Dushan Wadduwage with your CV, the direction you are interested in and why, and one of our papers you read, with a question or idea about it. A subject line such as \"Prospective PhD student: differentiable microscopy\" helps."
    - "Apply to the ODU graduate program by its deadline and name the lab in your statement."
    - "Some admitted students choose to start a small remote project with the lab before they arrive. It is optional and not a condition of admission."
  extra: "ODU M.S. and undergraduate students who would like research experience are also welcome to write."
  links:
    - label: "ODU graduate admissions"
      url: "https://www.odu.edu/admission/graduate"
    - label: "Email Dushan Wadduwage"
      url: "mailto:dwadduwa@odu.edu"

# ---------- Learning path ----------
path:
  intro: "About ten to twelve weeks at eight to ten hours a week for a student with an engineering or physics background. Do the foundations first, then run the deep learning track in parallel with optics and computational imaging, and finish with the reading on multiphoton microscopy. If time is short, do the items marked <span class=\"res-core\">core</span>. Items marked <span class=\"res-ours\">our course</span> are assigned in the lab's own courses at ODU."
  visa_note: "International students: start the visa steps in <a href=\"#arrival\">Joining ODU</a> first; appointments can take weeks."
  tracks:
    - id: "foundations"
      when: "Weeks 1–2"
      title: "Foundations: math, Python and tools"
      summary: "The lab's courses expect linear algebra and programming experience (Python in DASC 428/528)."
      items:
        - title: "Essence of Linear Algebra"
          by: "3Blue1Brown"
          url: "https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"
          kind: "Video series"
          time: "4 h"
          core: true
        - title: "18.06 Linear Algebra"
          by: "Gilbert Strang, MIT OpenCourseWare"
          url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/"
          kind: "Course"
          time: "reference"
        - title: "Python Data Science Handbook"
          by: "Jake VanderPlas"
          url: "https://jakevdp.github.io/PythonDataScienceHandbook/"
          kind: "Free book"
          time: "8 h"
          core: true
        - title: "Scientific Python Lectures"
          by: "NumPy, SciPy, Matplotlib, scikit-image"
          url: "https://lectures.scientific-python.org/"
          kind: "Tutorials"
          time: "6 h"
        - title: "The Missing Semester of Your CS Education"
          by: "MIT CSAIL"
          url: "https://missing.csail.mit.edu/"
          kind: "Course"
          time: "6 h"
          note: "Shell, Git, editors and debugging."
        - title: "The Good Research Code Handbook"
          by: "Patrick Mineault"
          url: "https://goodresearch.dev/"
          kind: "Free book"
          time: "3 h"
    - id: "deep-learning"
      when: "Weeks 3–10"
      title: "Deep learning"
      summary: "Follows the module order of DASC 428/528, Introduction to Deep Learning and Modern AI: one module a week, with the matching podcast episode."
      items:
        - title: "Foundations of Computer Vision, chapters 9–12, 14, 24, 26, 30 and 35–37"
          by: "Antonio Torralba, Phillip Isola and William T. Freeman (MIT Press, 2024)"
          url: "https://visionbook.mit.edu/"
          kind: "Free book"
          time: "8 weeks"
          ours: true
          core: true
        - title: "PyTorch: Learn the Basics"
          by: "PyTorch tutorials"
          url: "https://docs.pytorch.org/tutorials/beginner/basics/intro.html"
          kind: "Tutorial"
          time: "4 h"
          ours: true
          core: true
        - title: "Tensor &amp; Bias"
          by: "Podcast of DASC 428/528"
          url: "https://open.spotify.com/show/033Aem6pMGVLeZftOmAEFj"
          kind: "Podcast"
          time: "8 episodes"
          ours: true
        - title: "The Illustrated Transformer"
          by: "Jay Alammar"
          url: "https://jalammar.github.io/illustrated-transformer/"
          kind: "Article"
          time: "1 h"
          ours: true
        - title: "Understanding Deep Learning"
          by: "Simon J. D. Prince"
          url: "https://udlbook.github.io/udlbook/"
          kind: "Free book"
          time: "reference"
          note: "Keep it open as a reference for the math."
    - id: "optics"
      when: "Weeks 3–10, in parallel"
      title: "Optics and microscopy"
      summary: "Wave optics and image formation are the language of the lab's instruments."
      items:
        - title: "2.71 Optics"
          by: "George Barbastathis, Colin Sheppard and Se Baek Oh, MIT OpenCourseWare"
          url: "https://ocw.mit.edu/courses/2-71-optics-spring-2009/"
          kind: "Course"
          time: "15 h"
          core: true
          note: "Focus on wave optics, diffraction, Fourier optics and image formation."
        - title: "Microscopy Series"
          by: "iBiology"
          url: "https://www.ibiology.org/online-biology-courses/microscopy-series/"
          kind: "Video series"
          time: "6 h"
          core: true
        - title: "MicroscopyU"
          by: "Nikon"
          url: "https://www.microscopyu.com/"
          kind: "Tutorials"
          time: "reference"
        - title: "Introduction to Fourier Optics"
          by: "Joseph W. Goodman"
          kind: "Book"
          time: "reference"
        - title: "Introduction to Optical Microscopy"
          by: "Jerome Mertz"
          kind: "Book"
          time: "reference"
    - id: "comp-imaging"
      when: "Weeks 5–10"
      title: "Computational imaging and inverse problems"
      summary: "Follows CS 795/895, Computational Imaging: image formation, forward models, noise and resolution, then classical and neural inverse methods."
      items:
        - title: "Deep optical coding design in computational imaging: a data-driven framework"
          by: "Argüello et al., IEEE Signal Processing Magazine (2023)"
          url: "https://doi.org/10.1109/MSP.2022.3200173"
          kind: "Tutorial review"
          time: "2 h"
          ours: true
          core: true
          note: "Co-authored by the lab; an introduction to designing optics and networks together."
        - title: "Computational Optical Imaging: notebooks and code"
          by: "David J. Brady, University of Arizona (companion to his textbook)"
          url: "https://github.com/arizonaCameraLab/computationalImaging"
          kind: "Code"
          time: "10 h"
          ours: true
        - title: "Single-pixel imaging via compressive sampling"
          by: "Duarte et al., IEEE Signal Processing Magazine (2008)"
          url: "https://doi.org/10.1109/MSP.2007.914730"
          kind: "Paper"
          time: "1 h"
        - title: "Deep learning techniques for inverse problems in imaging"
          by: "Ongie et al. (2020)"
          url: "https://arxiv.org/abs/2005.06001"
          kind: "Survey"
          time: "2 h"
        - title: "EE367 Computational Imaging"
          by: "Gordon Wetzstein, Stanford"
          url: "https://web.stanford.edu/class/ee367/"
          kind: "Course notes"
          time: "reference"
    - id: "multiphoton"
      when: "Weeks 11–12"
      title: "Multiphoton and temporal-focusing microscopy"
      summary: "Background for the DEEP family of instruments. Read these before the lab's own DEEP papers."
      items:
        - title: "Two-photon laser scanning fluorescence microscopy"
          by: "Denk, Strickler and Webb, Science (1990)"
          url: "https://doi.org/10.1126/science.2321027"
          kind: "Paper"
          time: "1 h"
          core: true
        - title: "Deep tissue two-photon microscopy"
          by: "Helmchen and Denk, Nature Methods (2005)"
          url: "https://doi.org/10.1038/nmeth818"
          kind: "Review"
          time: "2 h"
        - title: "Scanningless depth-resolved microscopy"
          by: "Oron, Tal and Silberberg, Optics Express (2005)"
          url: "https://doi.org/10.1364/OPEX.13.001468"
          kind: "Paper"
          time: "1 h"
        - title: "Simultaneous spatial and temporal focusing of femtosecond pulses"
          by: "Zhu et al., Optics Express (2005)"
          url: "https://doi.org/10.1364/OPEX.13.002153"
          kind: "Paper"
          time: "1 h"
        - title: "Scanless two-photon excitation with temporal focusing"
          by: "Papagiakoumou, Ronzitti and Emiliani, Nature Methods (2020)"
          url: "https://doi.org/10.1038/s41592-020-0795-y"
          kind: "Review"
          time: "2 h"
  exercises_intro: "Self-check exercises adapted from assignments in the lab's courses. Do them in a Colab notebook and share it with Dushan before your first one-on-one meeting."
  exercises:
    - title: "Sampling"
      from: "CS 795/895"
      time: "≈3 h"
      text: "Sample a 1D signal and then a 2D image above, at and below the Nyquist rate, reconstruct them, and explain the aliasing you see."
    - title: "Noise and denoising"
      from: "CS 795/895"
      time: "≈10 h"
      text: "Write a forward model with Poisson (shot) and Gaussian (read) noise for a fluorescence image, then train one supervised and one self-supervised denoiser (in the spirit of <a href=\"https://arxiv.org/abs/1811.10980\">Noise2Void</a>) and compare them."
    - title: "Fourier features"
      from: "CS 740/840"
      time: "≈10 h"
      text: "Reproduce <a href=\"https://arxiv.org/abs/2006.10739\">Fourier Features Let Networks Learn High Frequency Functions</a> (Tancik et al., 2020). Sweep depth, width, learning rate and the size of the Fourier mapping, then replace the MLP with a CNN."
    - title: "Architecture audit"
      from: "DASC 428/528"
      time: "≈2 h"
      text: "Take a small CNN written for 28×28 grayscale images and adapt it to CIFAR-10. Recompute every tensor shape and the parameter count by hand before you run it."

# ---------- Read our work (per research thrust) ----------
papers_intro: "Three to five papers per research direction, in the order we suggest reading them. Start with the direction you are most likely to work on, then read the first paper of each of the others."
papers:
  - thrust: "Differentiable microscopy"
    title: "Optics designed by machine learning"
    items:
      - label: "Towards ultrafast quantitative phase imaging via differentiable microscopy · Biomedical Optics Express 2024"
        url: "https://doi.org/10.1364/BOE.504954"
        why: "A worked example of learning the optics and the reconstruction together."
      - label: "Differentiable microscopy designs an all optical phase retrieval microscope · arXiv 2022"
        url: "https://arxiv.org/abs/2203.14944"
        why: "The next step: the light does all of the computation. Pairs with the Colab notebooks."
      - label: "QuATON: quantization aware training of optical neurons · Optics Express 2026"
        url: "https://doi.org/10.1364/OE.546074"
        why: "How learned optical elements survive the limits of fabrication."
      - label: "3D nanoprecise metastructures, with the Boyden and So labs · Nature Photonics 2026"
        url: "https://doi.org/10.1038/s41566-026-01896-1"
        why: "A fabrication route for the 3D optical structures that learned designs need."
      - label: "Beyond the thin-layer limit: volumetric diffractive networks · arXiv 2026"
        url: "https://arxiv.org/abs/2606.07896"
        why: "Advanced: differentiable beam propagation for thick optical networks."
  - thrust: "DEEP · de-scattering with excitation patterning"
    title: "Imaging deep inside living tissue"
    items:
      - label: "DEEP · Science Advances 2021"
        url: "https://doi.org/10.1126/sciadv.aay5496"
        why: "The founding paper: patterned excitation and computation to image through scattering."
      - label: "DEEP² · Light: Science &amp; Applications 2023"
        url: "https://doi.org/10.1038/s41377-023-01248-6"
        why: "A neural network makes DEEP about ten times faster. Code and data are public."
      - label: "mosTF microscopy for in vivo brain imaging · Scientific Reports 2024"
        url: "https://doi.org/10.1038/s41598-024-57208-6"
        why: "A related optical approach to scattering, with the So and Nedivi labs."
      - label: "Untrained networks for structured illumination · Chemical &amp; Biomedical Imaging 2026"
        url: "https://doi.org/10.1021/cbmi.5c00153"
        why: "Reconstruction that learns from the physics of one experiment instead of a training set."
      - label: "Motion-guided sparse correction for microscopy point tracking · arXiv 2026"
        url: "https://arxiv.org/abs/2605.29220"
        why: "Following moving cells in microscopy video, with a browser demo."
  - thrust: "Bias · uncertainty · validity"
    title: "Trustworthy machine learning for biomedicine"
    items:
      - label: "Thinking in groups: permutation tests reveal near-out-of-distribution · arXiv 2024"
        url: "https://arxiv.org/abs/2403.14058"
        why: "A gentle introduction to testing models on groups of samples."
      - label: "Beyond Perfect Scores: proof-by-contradiction for trustworthy ML · arXiv 2026"
        url: "https://arxiv.org/abs/2601.06704"
        why: "The core method: does a reported accuracy reflect real signal? Code is public."
      - label: "Uncertainty-aware labeling in digital pathology · WACV 2025"
        url: "https://doi.org/10.1109/WACV61041.2025.00067"
        why: "Uncertainty estimates put to work in pathology."
      - label: "Phase microscopy and genome sequencing for resistance detection · Frontiers in Microbiology 2023"
        url: "https://doi.org/10.3389/fmicb.2023.1154620"
        why: "The application domain: antimicrobial resistance."

# ---------- Run our code ----------
code_intro: "Public repositories that are good first exercises, easiest first. Getting a published result to run on your own machine is the fastest way to learn a codebase."
code:
  - name: "All-Optical-QPM"
    repo: "https://github.com/wadduwagelab/All-Optical-QPM"
    what: "PyTorch and Colab notebooks. Train a differentiable optical system end to end; nothing to install."
  - name: "DEEP-squared"
    repo: "https://github.com/wadduwagelab/DEEP-squared"
    doi: "10.5281/zenodo.8161051"
    what: "Code and dataset for learned de-scattering: how patterned-excitation images become a reconstruction."
  - name: "Beyond Perfect Scores"
    repo: "https://github.com/wadduwagelab/Beyond-Perfect-Scores"
    what: "Label-permutation tests that check whether a classifier's accuracy is real."
  - name: "RIPPLE"
    repo: "https://github.com/wadduwagelab/ripple"
    demo: "https://huggingface.co/spaces/Le0nZim/ripple-demo"
    what: "Point tracking for microscopy video. Try the browser demo first (it may take a minute to wake up), then run the code."
  - name: "deep-tfm"
    repo: "https://github.com/dushanw/deep-tfm"
    what: "MATLAB code for the original DEEP-TFM reconstruction behind the Science Advances paper."

# ---------- How the lab works ----------
work_intro: "What to expect once you join."
work:
  - title: "Meetings"
    points:
      - "A weekly lab meeting where members present their progress."
      - "Regular one-on-one meetings with Dushan that end with a short list of next actions."
      - "Joint group meetings with a neighboring physics group at ODU."
  - title: "Projects"
    points:
      - "Students typically lead one or two main projects, often in small teams, with written milestones for each."
      - "Before starting a new idea, check whether it has been done and write a few pages on the current state of the art."
      - "Reproduce published baselines before claiming an improvement."
  - title: "Tools"
    points:
      - "Slack and a group chat for day-to-day communication; invitations come when you join."
      - "Code on GitHub in the <a href=\"https://github.com/wadduwagelab\">wadduwagelab</a> organization; manuscripts in Overleaf."
      - "Python with PyTorch or JAX; MATLAB for some older code; GPU workstations and the <a href=\"https://www.odu.edu/hpc\">ODU high-performance computing</a> clusters."
  - title: "AI tools"
    points:
      - "AI tools are encouraged: coding assistants and AI search make the lab more productive."
      - "Rigor still applies: understand and check any code you submit, however it was written."
      - "Verify every reference an AI tool gives you against the original paper."
  - title: "Code and data"
    points:
      - "Organize each project so that someone else could rerun the analysis: script every step and archive the code and data behind every figure."
      - "Released repositories should have a README, a license, a citation file and a Zenodo DOI."
      - "Papers are usually posted on arXiv when they are submitted."
  - title: "Authorship"
    points:
      - "Author order reflects each person's contribution; co-authors agree on it together."
      - "The student who leads the work is usually first author, and Dushan is usually the corresponding author."
      - "Everyone who contributed is credited, as a co-author or in the acknowledgments according to their contribution."

# ---------- Writing and figures ----------
writing:
  workflow_intro: "How a manuscript gets written in the lab."
  workflow:
    - "Agree with Dushan on the paper's idea and its list of figures, then write an outline yourself and get his approval."
    - "Make all of the figures first and review them together."
    - "Write the abstract and introduction; review them together."
    - "Write the first full draft of the methods, results and discussion yourself, without AI. Get the science right first and polish later."
    - "Polish one section at a time. An AI tool may be used as a tutor, but it may not add data or citations. When you send the draft, list two or three writing habits you are working on."
    - "Dushan refines the draft and writes the journal cover letter; suggested reviewers are chosen together."
  figures:
    - "One sans-serif font (Arial or Helvetica) throughout; axis titles about 12 pt, tick labels about 10 pt."
    - "Colorblind-safe colormaps such as viridis; never red against green."
    - "Plots made with Python (Matplotlib or Seaborn), R or GraphPad Prism, never default spreadsheet charts; schematics in BioRender or a similar tool, not PowerPoint shapes or clip art."
    - "Export at 300 dpi or more as TIFF or vector files; no screenshots and no JPEGs."
  read:
    - title: "Writing in the Sciences"
      by: "Kristin Sainani, Stanford (free to audit, 8 modules)"
      url: "https://www.coursera.org/learn/sciwrite"
    - title: "Whitesides' group: writing a paper"
      by: "George M. Whitesides, Advanced Materials (2004)"
      url: "https://doi.org/10.1002/adma.200400767"
    - title: "Ten simple rules for structuring papers"
      by: "Mensh and Kording, PLOS Computational Biology (2017)"
      url: "https://doi.org/10.1371/journal.pcbi.1005619"

