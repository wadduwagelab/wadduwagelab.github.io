# Site Settings
title: "Wadduwage Lab"
description: "Wadduwage Lab – Differentiable microscopy and computational imaging at Old Dominion University. Research in biophotonics, AI, and next-generation imaging."
url: "https://wadduwagelab.com" # Set to your live domain (e.g. https://wadduwagelab.github.io for GitHub Pages)
baseurl: "" # Subpath of your site (e.g. /newwadduwagelab if project site on GitHub Pages)

# Build Settings
markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Navigation (anchor links scroll to sections on front page)
navigation:
  - title: Team
    url: /#team
  - title: Publications
    url: /#publications
  - title: Patents
    url: /#patents
  - title: Funding
    url: /#funding

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - .bundle

# Exclude from watching (Jekyll will still build but won't watch these)
watch_exclude:
  - vendor
  - .bundle
  - node_modules
